# Render blueprint for the AccessMap backend (Node/Express + Prisma/Postgres).
#
# The build command runs database migrations, so a schema change ships with its
# migration and the deploy applies it before the new server starts:
#   npm ci               install deps (prisma is a runtime dep, so its CLI is
#                        present even with NODE_ENV=production)
#   prisma generate      regenerate the client for the current schema
#   prisma migrate deploy apply any pending migrations to DATABASE_URL
# `migrate deploy` only applies committed migrations (never generates or resets),
# and a failed migration fails the BUILD — so a bad migration blocks the deploy
# instead of crash-looping a live server. See `npm run build` in package.json.
#
# NOTE: Render does NOT retroactively apply this blueprint to a service that was
# created through the dashboard. For the existing backend service, set the same
# Build Command in the dashboard (Settings → Build & Deploy):
#     npm ci && npm run build
# This file keeps that in the repo and drives any service created from the
# blueprint going forward.
services:
  - type: web
    name: accessmap-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/venues/search
    envVars:
      # Set these in the Render dashboard — never commit their values.
      # Names mirror .env.example.
      - key: DATABASE_URL # Supabase Postgres (pooler port 6543 needs ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL # direct/session connection (5432, no pgbouncer) — migrate deploy
        sync: false
      - key: SUPABASE_URL # preferred — verifies tokens against the project's JWKS
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS # comma-separated allow-list incl. the deployed frontend
        sync: false
